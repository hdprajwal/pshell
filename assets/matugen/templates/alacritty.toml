# Generated by pshell from the wallpaper; overwritten on every theme change.
# No post_hook: alacritty watches its imported files and reloads on its own.

[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
cursor = "{{colors.on_surface.default.hex}}"
text = "{{colors.surface.default.hex}}"

[colors.selection]
background = "{{colors.primary.default.hex}}"
text = "{{colors.on_primary.default.hex}}"

# pshell's xterm seeds, blended into the wallpaper's palette. Black and white
# come from the surface ramp instead: an achromatic seed has no hue for
# matugen to keep, and blending one returns a pastel.
[colors.normal]
black   = "{{colors.surface_container_highest.default.hex}}"
red     = "{{colors.ansi_1.default.hex}}"
green   = "{{colors.ansi_2.default.hex}}"
yellow  = "{{colors.ansi_3.default.hex}}"
blue    = "{{colors.ansi_4.default.hex}}"
magenta = "{{colors.ansi_5.default.hex}}"
cyan    = "{{colors.ansi_6.default.hex}}"
white   = "{{colors.on_surface_variant.default.hex}}"

[colors.bright]
black   = "{{colors.outline.default.hex}}"
red     = "{{colors.ansi_9.default.hex}}"
green   = "{{colors.ansi_10.default.hex}}"
yellow  = "{{colors.ansi_11.default.hex}}"
blue    = "{{colors.ansi_12.default.hex}}"
magenta = "{{colors.ansi_13.default.hex}}"
cyan    = "{{colors.ansi_14.default.hex}}"
white   = "{{colors.on_surface.default.hex}}"
