# Generated by pshell from the wallpaper; overwritten on every theme change.

background = {{colors.surface.default.hex}}
foreground = {{colors.on_surface.default.hex}}

cursor-color = {{colors.on_surface.default.hex}}
cursor-text = {{colors.surface.default.hex}}

selection-background = {{colors.primary.default.hex}}
selection-foreground = {{colors.on_primary.default.hex}}

# pshell's xterm seeds, blended into the wallpaper's palette. The achromatic
# four (0, 7, 8, 15) come from the surface ramp instead: a black or grey seed
# has no hue for matugen to keep, and blending one returns a pastel.
palette = 0={{colors.surface_container_highest.default.hex}}
palette = 1={{colors.ansi_1.default.hex}}
palette = 2={{colors.ansi_2.default.hex}}
palette = 3={{colors.ansi_3.default.hex}}
palette = 4={{colors.ansi_4.default.hex}}
palette = 5={{colors.ansi_5.default.hex}}
palette = 6={{colors.ansi_6.default.hex}}
palette = 7={{colors.on_surface_variant.default.hex}}
palette = 8={{colors.outline.default.hex}}
palette = 9={{colors.ansi_9.default.hex}}
palette = 10={{colors.ansi_10.default.hex}}
palette = 11={{colors.ansi_11.default.hex}}
palette = 12={{colors.ansi_12.default.hex}}
palette = 13={{colors.ansi_13.default.hex}}
palette = 14={{colors.ansi_14.default.hex}}
palette = 15={{colors.on_surface.default.hex}}
