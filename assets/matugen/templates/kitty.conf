# Generated by pshell from the wallpaper; overwritten on every theme change.

# surface, not background, matching the bar's own choice of tone.
foreground            {{colors.on_surface.default.hex}}
background            {{colors.surface.default.hex}}

# Inverted-video cursor: block cursors need the text under them readable.
cursor                {{colors.on_surface.default.hex}}
cursor_text_color     {{colors.surface.default.hex}}

selection_background  {{colors.primary.default.hex}}
selection_foreground  {{colors.on_primary.default.hex}}
url_color             {{colors.primary.default.hex}}

active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline.default.hex}}
bell_border_color     {{colors.error.default.hex}}

active_tab_background   {{colors.primary.default.hex}}
active_tab_foreground   {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}

# The ansi_* colours are pshell's xterm seeds blended into the wallpaper's
# palette by matugen, so red is still red -- not an accent shade. The
# achromatic four (0, 7, 8, 15) come from the surface ramp instead: a black
# or grey seed has no hue for matugen to keep, and blending one returns a
# pastel of whichever hue it guesses -- pink "black", on the wrong wallpaper.
color0   {{colors.surface_container_highest.default.hex}}
color1   {{colors.ansi_1.default.hex}}
color2   {{colors.ansi_2.default.hex}}
color3   {{colors.ansi_3.default.hex}}
color4   {{colors.ansi_4.default.hex}}
color5   {{colors.ansi_5.default.hex}}
color6   {{colors.ansi_6.default.hex}}
color7   {{colors.on_surface_variant.default.hex}}
color8   {{colors.outline.default.hex}}
color9   {{colors.ansi_9.default.hex}}
color10  {{colors.ansi_10.default.hex}}
color11  {{colors.ansi_11.default.hex}}
color12  {{colors.ansi_12.default.hex}}
color13  {{colors.ansi_13.default.hex}}
color14  {{colors.ansi_14.default.hex}}
color15  {{colors.on_surface.default.hex}}
